name: Tests and Parity Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run unit and parity tests
      run: |
        python -m pytest tests/ -v

    - name: Run Colab notebook reproduction verification
      run: |
        python -c "
        import json
        with open('notebooks/reproduce_ssac27.ipynb', encoding='utf-8') as f:
            nb = json.load(f)
        assert len(nb['cells']) <= 10, 'Notebook has more than 10 cells'
        g = {}
        for c in nb['cells']:
            exec(''.join(c['source']), g)
        print('SSAC27 Reproduction Verified')
        "
